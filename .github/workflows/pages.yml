name: GitHub Pages

on:
  workflow_run:
    workflows:
      - Stable Windows release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deployment is a side effect. Do not cancel a deployment halfway through.
concurrency:
  group: github-pages-${{ github.ref }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Build and deploy the local documentation site
    runs-on: windows-2025
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Bootstrap missing deployment tools from canonical releases
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bootstrap-actions-tools.ps1

      - name: Verify deployment dependency bootstrap
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-self-hosted-bootstrap.ps1 -Phase preinstall

      - name: Prepare Windows-safe Pages staging path
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'material-download-manager-pages'
          "PAGES_STAGING_PATH=$staging" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build site to an isolated staging directory
        shell: pwsh
        run: node site/build.mjs "$env:PAGES_STAGING_PATH" --package-only

      - name: Inject verified stable release metadata into the staging site
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $parts = $env:GITHUB_REPOSITORY.Split('/', 2)
          $pagesUrl = "https://$($parts[0].ToLowerInvariant()).github.io/$($parts[1].ToLowerInvariant())/"
          pwsh -NoProfile -File scripts/prepare-pages-release-manifest.ps1 `
            -OutputDirectory "$env:PAGES_STAGING_PATH" `
            -PagesUrl $pagesUrl `
            -ExpectedSourceCommit '${{ github.event.workflow_run.head_sha }}'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Archive Pages artifact with PowerShell
        shell: pwsh
        run: |
          $tar = Get-Command tar.exe -ErrorAction SilentlyContinue
          if ($null -eq $tar) {
            throw 'The runner must provide tar.exe for the Pages archive.'
          }
          $artifactPath = Join-Path $env:RUNNER_TEMP 'artifact.tar'
          if (Test-Path -LiteralPath $artifactPath -PathType Leaf) {
            Remove-Item -LiteralPath $artifactPath -Force
          }
          & $tar.Source -c -f $artifactPath `
            --exclude=.git `
            --exclude=.github `
            -C $env:PAGES_STAGING_PATH .
          if ($LASTEXITCODE -ne 0) {
            throw "tar.exe failed to archive the Pages site with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
            throw "tar.exe did not create the Pages artifact: $artifactPath"
          }
          "PAGES_ARTIFACT_PATH=$artifactPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the published Pages response
        shell: pwsh
        env:
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          $uri = [string]$env:DEPLOYED_PAGE_URL
          if ([string]::IsNullOrWhiteSpace($uri)) {
            $parts = $env:GITHUB_REPOSITORY.Split('/', 2)
            $uri = "https://$($parts[0].ToLowerInvariant()).github.io/$($parts[1].ToLowerInvariant())/"
          }
          $response = Invoke-WebRequest -UseBasicParsing -Uri $uri -TimeoutSec 30
          if ($response.StatusCode -ne 200 -or [string]$response.Content -notmatch 'Material Download Manager') {
            throw "Published Pages response was not the expected site: $uri"
          }
          Write-Output "Verified published Pages response: $uri"

      - name: Collect safe Pages evidence
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          PAGES_JOB_STATUS: ${{ job.status }}
        run: |
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP 'material-download-manager-pages-evidence'
          New-Item -ItemType Directory -Path $evidenceDirectory -Force | Out-Null
          [ordered]@{
            runId = $env:GITHUB_RUN_ID
            sourceCommit = $env:GITHUB_SHA
            jobStatus = $env:PAGES_JOB_STATUS
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            deployedPageUrl = '${{ steps.deployment.outputs.page_url }}'
            collectedAt = [DateTimeOffset]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidenceDirectory 'run-context.json') -Encoding utf8NoBOM
          $pagesArchive = Join-Path $env:RUNNER_TEMP 'artifact.tar'
          if (Test-Path -LiteralPath $pagesArchive -PathType Leaf) {
            Copy-Item -LiteralPath $pagesArchive -Destination $evidenceDirectory
          }

      - name: Upload safe Pages evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pages-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/material-download-manager-pages-evidence
          if-no-files-found: warn
          retention-days: 7
