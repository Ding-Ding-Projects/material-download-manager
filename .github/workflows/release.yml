name: Stable Windows release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build, package, and publish the stable unsigned release
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: design/package-lock.json

      - name: Bootstrap missing build tools from canonical releases
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bootstrap-actions-tools.ps1

      - name: Verify build dependency bootstrap before install
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-self-hosted-bootstrap.ps1 -Phase preinstall

      - name: Install locked dependencies
        working-directory: design
        run: npm ci --no-audit --no-fund

      - name: Complete native dependency bootstrap
        shell: pwsh
        run: pwsh -NoProfile -File scripts/complete-node-binary-bootstrap.ps1

      - name: Verify build dependency bootstrap after install
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-self-hosted-bootstrap.ps1 -Phase postinstall

      - name: Build application
        working-directory: design
        run: |
          npm run build:renderer
          npm run build:electron

      - name: Count source, tests, styles, markup, and surviving blame attribution
        id: line_count
        shell: pwsh
        run: |
          $lineCountPath = Join-Path $env:RUNNER_TEMP 'line-count.tsv'
          node scripts/count-lines.mjs 1> $lineCountPath
          if ($LASTEXITCODE -ne 0) {
            throw "scripts/count-lines.mjs failed with exit code $LASTEXITCODE."
          }
          $lineCount = Get-Content -LiteralPath $lineCountPath -Raw
          if ([string]::IsNullOrWhiteSpace($lineCount)) {
            throw 'scripts/count-lines.mjs returned no table.'
          }
          if ($lineCount -notmatch '(?m)^record\tscope\tname\tfiles\tlines\tnonBlank\tbytes\tagentLines\thumanOtherLines\tagentNonBlank\thumanOtherNonBlank\s*$') {
            throw 'The line-count table is missing surviving git-blame attribution columns.'
          }
          foreach ($row in @(
              'summary\tproject\ttotal\t',
              'summary\tproject\thand-written-total\t',
              'attribution\tproject\tall-included\t',
              'attribution\tproject\thand-written\t'
            )) {
            if ($lineCount -notmatch "(?m)^$row") {
              throw "The line-count table is missing row $row."
            }
          }
          "path=$lineCountPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Reserve a monotonic stable version tag
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $versionPath = Join-Path $env:RUNNER_TEMP 'release-version.json'
          pwsh -NoProfile -File scripts/resolve-release-version.ps1 -OutputPath $versionPath
          $version = Get-Content -LiteralPath $versionPath -Raw | ConvertFrom-Json -Depth 20
          "path=$versionPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$($version.tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($version.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Reserve a unique dim-sum catalog code name when published
        id: metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP 'release-metadata.json'
          pwsh -NoProfile -File scripts/prepare-release-metadata.ps1 -OutputPath $metadataPath
          "path=$metadataPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build unsigned Squirrel.Windows package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-unsigned-squirrel.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Verify UNSIGNED Setup.exe, RELEASES, and full packages
        id: artifacts
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:RUNNER_TEMP 'release-assets.json'
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'
          pwsh -NoProfile -File scripts/validate-squirrel-artifacts.ps1 -OutputDirectory $assetDirectory -ManifestPath $manifestPath -OwnedOutputRoot $env:RUNNER_TEMP
          "path=$manifestPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package the Chromium extension release asset
        id: extension
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:RUNNER_TEMP 'release-assets.json'
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'
          pwsh -NoProfile -File scripts/package-extension.ps1 -OutputDirectory $assetDirectory -ManifestPath $manifestPath -Version '${{ steps.version.outputs.version }}'

      - name: Publish and verify draft=false, isPrerelease=false stable release
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pwsh -NoProfile -File scripts/publish-stable-release.ps1 `
            -MetadataPath '${{ steps.metadata.outputs.path }}' `
            -VersionPath '${{ steps.version.outputs.path }}' `
            -LineCountPath '${{ steps.line_count.outputs.path }}' `
            -ArtifactManifestPath '${{ steps.artifacts.outputs.path }}'

      - name: Collect safe release evidence
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
          SQUIRREL_ARTIFACTS_OUTCOME: ${{ steps.artifacts.outcome }}
          EXTENSION_ARTIFACT_OUTCOME: ${{ steps.extension.outcome }}
        run: |
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP 'material-download-manager-release-evidence'
          New-Item -ItemType Directory -Path $evidenceDirectory -Force | Out-Null
          [ordered]@{
            runId = $env:GITHUB_RUN_ID
            sourceCommit = $env:GITHUB_SHA
            jobStatus = $env:RELEASE_JOB_STATUS
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            collectedAt = [DateTimeOffset]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidenceDirectory 'run-context.json') -Encoding utf8NoBOM

          foreach ($candidate in @(
              (Join-Path $env:RUNNER_TEMP 'release-assets.json'),
              (Join-Path $env:RUNNER_TEMP 'release-version.json'),
              (Join-Path $env:RUNNER_TEMP 'release-metadata.json'),
              (Join-Path $env:RUNNER_TEMP 'line-count.tsv')
            )) {
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              Copy-Item -LiteralPath $candidate -Destination $evidenceDirectory
            }
          }
          $releaseAssets = Join-Path $env:RUNNER_TEMP 'release-assets'
          $releaseManifestPath = Join-Path $env:RUNNER_TEMP 'release-assets.json'
          if ($env:SQUIRREL_ARTIFACTS_OUTCOME -eq 'success' -and
              $env:EXTENSION_ARTIFACT_OUTCOME -eq 'success' -and
              (Test-Path -LiteralPath $releaseAssets -PathType Container) -and
              (Test-Path -LiteralPath $releaseManifestPath -PathType Leaf)) {
            try {
              $releaseManifest = Get-Content -LiteralPath $releaseManifestPath -Raw | ConvertFrom-Json -Depth 50
              if ([System.IO.Path]::GetFullPath([string]$releaseManifest.directory) -ne [System.IO.Path]::GetFullPath($releaseAssets)) {
                throw 'The validated manifest points outside the expected release-assets directory.'
              }
              $declaredNames = @($releaseManifest.names | ForEach-Object { [string]$_ })
              $declaredSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
              foreach ($name in $declaredNames) {
                if ([string]::IsNullOrWhiteSpace($name) -or [System.IO.Path]::GetFileName($name) -ne $name -or -not $declaredSet.Add($name)) {
                  throw "The validated manifest contains an invalid or duplicate evidence filename: $name"
                }
              }
              $actualItems = @(Get-ChildItem -LiteralPath $releaseAssets -Force)
              if (@($actualItems | Where-Object { $_.PSIsContainer -or ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) }).Count -ne 0) {
                throw 'The validated release-assets directory contains a directory or reparse point.'
              }
              $actualSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
              foreach ($item in $actualItems) { [void]$actualSet.Add($item.Name) }
              if ($actualSet.Count -ne $declaredSet.Count) {
                throw 'The validated evidence file count differs from the manifest.'
              }
              foreach ($name in $declaredSet) {
                if (-not $actualSet.Contains($name)) { throw "Validated evidence file is missing: $name" }
              }
              $evidenceAssets = Join-Path $evidenceDirectory 'release-assets'
              New-Item -ItemType Directory -Path $evidenceAssets -Force | Out-Null
              foreach ($name in $declaredSet) {
                Copy-Item -LiteralPath (Join-Path $releaseAssets $name) -Destination $evidenceAssets
              }
            } catch {
              Write-Warning "Validated release payload evidence was not copied: $($_.Exception.Message)"
            }
          }

      - name: Upload safe release evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/material-download-manager-release-evidence
          if-no-files-found: warn
          retention-days: 7
