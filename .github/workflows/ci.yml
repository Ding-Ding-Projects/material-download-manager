name: Windows verification

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: windows-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify on the contracted Windows runner
    runs-on: [self-hosted, windows, x64, material-download-manager-windows-x64]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: design/package-lock.json

      - name: Validate fresh bootstrap before dependencies
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-self-hosted-bootstrap.ps1 -Phase preinstall

      - name: Install locked dependencies
        working-directory: design
        run: npm ci --no-audit --no-fund

      - name: Complete native dependency bootstrap
        shell: pwsh
        run: pwsh -NoProfile -File scripts/complete-node-binary-bootstrap.ps1

      - name: Validate dependency bootstrap after npm ci
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-self-hosted-bootstrap.ps1 -Phase postinstall

      - name: Typecheck
        working-directory: design
        run: npm run typecheck

      - name: Build
        working-directory: design
        run: npm run build

      - name: Test downloader
        working-directory: design
        run: npm run test:engine

      - name: Test Electron paths
        working-directory: design
        run: npm run test:electron
